name: ShopAPI Demo CI with ReleaseGuard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check
        working-directory: ./shopapi_project

      - name: Run migrations
        run: python manage.py migrate --noinput
        working-directory: ./shopapi_project

      - name: Run tests
        run: pytest --tb=short
        working-directory: ./shopapi_project

  releaseguard:
    name: ReleaseGuard Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install ReleaseGuard CLI
        run: |
          pip install releaseguard-cli
          # Or build from source if not published
          # pip install -e ../releaseguard

      - name: Configure ReleaseGuard
        run: |
          # Configure ReleaseGuard with project token
          echo "RG_TOKEN=${{ secrets.RELEASEGUARD_TOKEN }}" >> $GITHUB_ENV
          echo "RG_PROJECT_ID=${{ secrets.RELEASEGUARD_PROJECT_ID }}" >> $GITHUB_ENV

      - name: Run ReleaseGuard Analysis
        run: |
          releaseguard analyze \
            --project-id ${{ secrets.RELEASEGUARD_PROJECT_ID }} \
            --token ${{ secrets.RELEASEGUARD_TOKEN }} \
            --junit results.xml \
            --commit ${{ github.sha }} \
            --branch ${{ github.ref_name }} \
            --workflow-run-id ${{ github.run_id }}
        working-directory: ./shopapi_project

      - name: Upload ReleaseGuard Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: releaseguard-report
          path: releaseguard-report.json

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, releaseguard]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "❌ CI failed for ${{ github.repository }}@${{ github.sha }}"
          echo "Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"